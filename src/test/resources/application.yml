spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: "this-is-a-test-secret-key-that-must-be-long-enough-for-security"
  access-expiration: 3600000      # 1시간 (60 * 60 * 1000)
  refresh-expiration: 1209600000  # 14일 (14 * 24 * 60 * 60 * 1000)